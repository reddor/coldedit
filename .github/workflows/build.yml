name: Build and release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  windows:
    name: Windows x64
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build, test and package
        shell: pwsh
        run: ./build.ps1 -Test -Package
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: packages-windows
          path: dist/ColdEdit-win64.zip
          if-no-files-found: error
          compression-level: 0

  linux:
    name: Linux x64
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install build and smoke-test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgl1-mesa-dev libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev xvfb xauth
      - name: Build, test, smoke-test and package
        run: bash build-linux.sh --test --smoke --package
      - name: Verify the packaged relink kit
        run: |
          cmake -S dist/ColdEdit-linux/relink -B build-linux-relink -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build-linux-relink --parallel 4
          env -u WAYLAND_DISPLAY LIBGL_ALWAYS_SOFTWARE=1 xvfb-run -a build-linux-relink/coldedit --smoke-test --report artifacts/linux-relink-smoke.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: packages-linux
          path: dist/ColdEdit-linux-x64.tar.gz
          if-no-files-found: error
          compression-level: 0
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: diagnostics-linux
          path: artifacts/linux-*.json

  web:
    name: WebAssembly
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Emscripten 4.0.23
        run: |
          git clone https://github.com/emscripten-core/emsdk.git third_party/emsdk
          git -C third_party/emsdk checkout c0bb220cb6e6f4e0fabb6f6db9efd53390ef5e56
          third_party/emsdk/emsdk install 4.0.23
          third_party/emsdk/emsdk activate 4.0.23
      - name: Build and package
        run: |
          source third_party/emsdk/emsdk_env.sh
          emcmake cmake -S . -B build-web -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF
          cmake --build build-web --parallel 4
          cmake --install build-web --prefix dist/Web
          cd dist/Web
          zip -qr ../ColdEdit-web.zip .
      - name: Generate codec fixtures
        run: |
          cmake -S . -B build-core -G Ninja -DCMAKE_BUILD_TYPE=Release -DCOLDEDIT_BUILD_APP=OFF
          cmake --build build-core --target coldedit_codec_tests --parallel 4
          build-core/coldedit_codec_tests --web-fixtures artifacts/codec-fixtures
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: packages-web
          path: dist/ColdEdit-web.zip
          if-no-files-found: error
          compression-level: 0
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: codec-fixtures
          path: artifacts/codec-fixtures/
          if-no-files-found: error

  web-tests:
    name: Web tests (${{ matrix.suite }})
    needs: web
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: lifecycle
            tests: web-smoke.cjs web-lifecycle.cjs
          - suite: controls
            tests: web-toolbar.cjs web-wheel.cjs
          - suite: editing
            tests: web-features.cjs web-selection.cjs
          - suite: cleanup
            tests: web-cleanup.cjs
          - suite: codecs
            tests: web-codecs.cjs web-mp3.cjs
          - suite: mobile
            tests: web-mobile.cjs
    env:
      COLDEDIT_BROWSER: chromium
      COLDEDIT_DPI: '1,1.25,2'
      BROWSER_TESTS: ${{ matrix.tests }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tests/package-lock.json
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: packages-web
          path: dist
      - name: Extract the web package under test
        run: |
          mkdir -p build-web/site
          unzip -q dist/ColdEdit-web.zip -d build-web/site
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: matrix.suite == 'codecs'
        with:
          name: codec-fixtures
          path: artifacts/codec-fixtures
      - name: Install browser test dependencies
        run: |
          npm ci --prefix tests
          cd tests
          npx playwright install --with-deps chromium
      - name: Browser tests
        run: node tests/run-web-tests.cjs $BROWSER_TESTS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: diagnostics-web-${{ matrix.suite }}
          path: |
            artifacts/*.json
            artifacts/*.png

  release:
    name: Publish GitHub release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [windows, linux, web-tests]
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: packages-*
          path: packages
          merge-multiple: true
      - name: Generate checksums
        working-directory: packages
        run: sha256sum ColdEdit-win64.zip ColdEdit-linux-x64.tar.gz ColdEdit-web.zip > SHA256SUMS.txt
      - name: Publish tested downloads
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          cat > release-notes.txt <<'EOF'
          Try ColdEdit in your browser: https://sqrctl.de/ce/

          Downloads: Windows x64 ZIP, Linux x64 tar.gz (Ubuntu 22.04 or newer), and the self-hostable web ZIP.
          Each archive includes dependency licenses and the LAME relink kit. SHA256SUMS.txt verifies the downloads.
          EOF
          gh release create "$RELEASE_TAG" packages/* --verify-tag --generate-notes --title "ColdEdit $RELEASE_TAG" --notes-file release-notes.txt
